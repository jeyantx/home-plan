<style>
:root{--bg:#f4f2ee;--panel:#ffffff;--ink:#1f2328;--muted:#5d646d;--line:#dcd8d0;--accent:#2f6f4f;--accent-ink:#fff;--chip:#eef3ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181b;--panel:#1f2226;--ink:#e8e6e1;--muted:#a3a8ae;--line:#33373c;--accent:#5fb08a;--accent-ink:#0d1a13;--chip:#23302a}}
:root[data-theme="dark"]{--bg:#16181b;--panel:#1f2226;--ink:#e8e6e1;--muted:#a3a8ae;--line:#33373c;--accent:#5fb08a;--accent-ink:#0d1a13;--chip:#23302a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0 6px 0 0;font-weight:650}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sp{margin-left:auto}
main{flex:1;min-height:0;display:flex}
#view{flex:1;position:relative;min-width:0}
#view canvas{display:block}
#view>canvas{position:absolute;left:0;top:0}
#view.framed{background:#3a3d41}
#hint{position:absolute;left:12px;bottom:10px;background:rgba(20,22,25,.72);color:#fff;font-size:12px;padding:5px 10px;border-radius:8px;pointer-events:none}
#tip{position:absolute;pointer-events:none;background:#1f2328;color:#fff;font-size:12.5px;line-height:1.35;padding:6px 9px;border-radius:7px;max-width:320px;display:none;z-index:5}
#tip b{color:#9fe0bf}
aside{width:380px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px 24px}
aside.off{display:none}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:14px 0 6px}
aside h2:first-child{margin-top:0}
.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t td,.t th{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top;text-align:left}
.t th{color:var(--muted);font-weight:600}
.t tr.mod{cursor:pointer}.t tr.mod:hover td{background:var(--chip)}
.t tr.sel td{background:var(--chip)}
td.c{font-weight:700;color:var(--accent);white-space:nowrap}
.sub{color:var(--muted);font-size:12px}
ul{margin:0;padding-left:18px}li{margin:3px 0}
.lab{font:600 10px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;background:rgba(31,35,40,.82);padding:2px 6px;border-radius:5px;white-space:nowrap;pointer-events:none}
.lab.dim{background:rgba(47,111,79,.92)}
.lab.small{font-weight:500;font-size:9.5px;background:rgba(31,35,40,.7)}
.nolab .lab{display:none}
@media (max-width:760px){aside{width:100%;max-height:40vh;border-left:0;border-top:1px solid var(--line)}main{flex-direction:column}}
</style>

kind": "washpad", "side": null, "note": "Side garden, paved with drain, in the corner of BW-02 and BW-03"}, {"id": "FU-54", "fl": "G", "name": "Wash basin with tap", "x1": 19.125, "x2": 20.625, "y1": 95.25, "y2": 96.5, "kind": "basin", "side": null, "note": "Back garden, against GW-08 beside window W-08"}, {"id": "FU-55", "fl": "G", "name": "Tap and wash platform", "x1": 17.625, "x2": 20.625, "y1": 96.75, "y2": 99.25, "kind": "washpad", "side": null, "note": "Back garden, paved, with floor drain"}, {"id": "FU-76", "fl": "G", "name": "Tree well round the neem", "x1": 10.5, "x2": 15.0, "y1": 2.5, "y2": 7.0, "kind": "treepit", "side": null, "note": "Parking, 4'6\" across, centred 6\" south of the trunk because the trunk leans south (it stays inside the ring up to the platform height): the trunk stays at today's ground; a low retaining ring, 4\u00bd\" brick with a granite coping; about 10\" of open soil with leaf mulch all round the 1'6\" trunk; small so the car can pass"}, {"id": "FU-73", "fl": "G", "name": "Flower bed along the back wall", "x1": 1.375, "x2": 20.625, "y1": 103.14, "y2": 105.6, "kind": "fbed", "side": null, "note": "Back and side garden, 1'6\" deep all along the back wall BW-09, 9\" brick kerb, red soil; a row of Tamil Nadu flowering plants PL-01 to PL-12"}, {"id": "FU-74", "fl": "G", "name": "Tulsi maadam", "x1": 4.5, "x2": 6.0, "y1": 96.75, "y2": 98.25, "kind": "tulsi", "side": null, "note": "Side garden, 1'6\" square, 3' high plastered pedestal with a lamp niche facing east, Tulsi PL-13 on top"}, {"id": "FU-75", "fl": "G", "name": "Clothes drying line", "x1": 10.25, "x2": 17.25, "y1": 101.0, "y2": 101.5, "kind": "cline", "side": null, "note": "Back garden, two black MS posts 6' high with T-arms, 3 steel wires, 7' long; clear of the back door D-10 and the wash platform"}, {"id": "FU-56", "fl": "G", "name": "Store under staircase 1", "x1": 17.125, "x2": 20.625, "y1": 10.997, "y2": 16.0, "kind": "store", "side": null, "note": "Parking, 3'6\" x 5', under the high end of ST-1A (about 3'3\" high at the front, 6'6\" at the back); floor at the parking level; door 2'6\" x 3'8\" facing east at its north end (Y 12' to 14'6\"), clear of the parked car; the low end of the stair is solid"}], "plot": [[0, 0], [21, 0], [21, 105.0], [1, 106.0], [1, 89.0], [0, 89.0]], "car": [11.125, 16.875, 14.75, 29.75], "porchY": 32.75, "underground": [["UG-01", "Septic tank, about 8,000 L (existing)", "rect", [13.583, 20.833, 1.0, 11.0], "existing tank, 7'3\" x 10' outside; assumed 6\" walls, about 6'3\" x 9' inside, 5'3\" of liquid, a partition making two chambers (to confirm on site)", [[14.6, 16.6, 7.0, 9.0], [14.6, 16.6, 1.05, 2.55]], "The tank already on the plot, 2\" from the west boundary and 1' in from the road: 18.8 m from BR-02 (the guideline is at least 15 m). Its openings are raised about 2' to the new ground: one tile-in cover on the small-gate platform (first chamber) and one on the gate crest (second chamber); a cleaning truck reaches them from the road through GT-02. The foot of the outside stair ST-1A and the small-gate steps stand over it, so the engineer must give the stair foot its own support (for example a beam on the tank walls) and check or recast the roof for the steps and about 2' of fill. Vent pipe 4\" up the west compound wall beside the small gate. The neem trunk is under 1' from its wall: no digging near the roots."], ["UG-02", "Soak pit for the septic tank", "circle", [3.5, 5.5, 2.25], "4' across inside, about 8' deep, honeycomb brick with gravel round it", [[3.5, 5.5, 1.0]], "New, just inside the car gate on the east side: 19.5 m from BR-02 (the guideline is at least 18 m) and 12' from the sump. A pipe from the septic tank's outlet runs across the gate crest, north of the tree well. Final depth from a soil (percolation) test. Heavy-duty round cover on the drive."], ["UG-03", "Underground water tank (sump), 6,000 L", "rect", [2.75, 8.75, 20.0, 28.5], "inside 5' x 7'6\", 6'5\" deep (5'8\" of water)", [[5.75, 7.75, 23.0, 25.0]], "At the front, under the east walkway beside the bikes, so a water lorry on the road fills it with about 25' of hose through GT-01; the town supply comes in from the road too. 10' from the septic tank and 12' from the soak pit (keep at least 10'). Waterproofed RCC with a heavy-duty top; a lockable tile-in cover in the walkway, clear of the bikes and the car. The bores at the back feed it by a pipe along the side passage, and a pump lifts the water to the overhead tank FU-71."], ["UG-04", "Rainwater recharge pit", "circle", [12.0, 99.5, 1.5], "3' across, 6' deep, filled with pebbles, gravel and sand", [[12.0, 99.5, 1.5]], "Back garden, 3' from the house. Roof downpipes run to it through a first-flush filter; it recharges the ground water for the bores (rainwater harvesting is compulsory in Tamil Nadu). Grated cover. The drive drain at the gate goes to the road drain."]], "kitchen": {"modules": [{"id": "K-01", "name": "Gas cylinder unit with blind corner", "run": "East run", "face": "x+", "x1": 3.5, "x2": 5.5, "y1": 59.125, "y2": 62.0, "z1": 0, "z2": 2.83, "fronts": [{"k": "blind", "a": 59.125, "b": 60.375, "za": 0.33, "zb": 2.7, "what": "blind corner behind the breakfast counter: spare cylinder"}, {"k": "door", "a": 60.375, "b": 62.0, "za": 0.33, "zb": 2.7, "hinge": "b", "what": "LPG cylinder on a pull-out trolley, vented base, short pipe to the hob"}], "inside": "cylinder trolley; spare cylinder in the blind corner; vent holes in the plinth", "need": "LPG cylinder next to the hob, out of sight but easy to change"}, {"id": "K-02", "name": "Hob unit, 3 drawers", "run": "East run", "face": "x+", "x1": 3.5, "x2": 5.5, "y1": 62.0, "y2": 64.375, "z1": 0, "z2": 2.83, "fronts": [{"k": "drawer", "a": 62.0, "b": 64.375, "za": 0.335, "zb": 1.27, "what": "pressure cookers, idli steamer and big pans"}, {"k": "drawer", "a": 62.0, "b": 64.375, "za": 1.29, "zb": 2.225, "what": "kadai, tawa, frying pans"}, {"k": "drawer", "a": 62.0, "b": 64.375, "za": 2.245, "zb": 2 // ---------------- interaction ----------------
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),tip=document.getElementById('tip');
const pickables=()=>fronts.flatMap(f=>f.meshes);
function hit(e){const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(pickables(),false)[0];return h?h.object.userData.front:null}
let down=null;renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const f=hit(e);if(f){toggle(f);select(f.rec.m.id,false)}});

function toggle(f,v){f.target=v===undefined?(f.target?0:1):v}
// re-parent each front so it rotates or slides from its pivot
for(const f of fronts){const g=new THREE.Group();if(f.origin){g.position.copy(f.origin);scene.add(g);for(const me of f.meshes){me.position.sub(f.origin);g.add(me)}}else{scene.add(g);for(const me of f.meshes)g.add(me)}f.g=g}

const RUN={E:new THREE.Group(),B:new THREE.Group(),F:new THREE.Group()};
for(const o of [...scene.children]){if(o.isLight||o===sun.target||o===room||Object.values(RUN).includes(o))continue;
  let k=runOf.get(o);if(!k){const c=new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()),X=-(o.isCSS2DObject?o.position.x:c.x)/F,Y=(o.isCSS2DObject?o.position.z:c.z)/F;k=X<5.6&&Y<64.3?'E':Y<60.7?'F':'B'}
  RUN[k].add(o)}
for(const g of Object.values(RUN))scene.add(g);
// unfolded: the east run swings about the back corner to face you on the left; the breakfast counter turns round to stand on the right
const UNF={E:{c:W(3.5,66.375,0),a:-Math.PI/2,off:W(-0.8,0,0)},F:{c:W(13.1125,62.75,0),a:Math.PI,off:W(0.8,0,0)}};
let unfoldT=0,unfoldTarget=0;
function placeRuns(){const e=unfoldT*unfoldT*(3-2*unfoldT);for(const k of ['E','F']){const u=UNF[k],q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),u.a*e);
  RUN[k].quaternion.copy(q);RUN[k].position.copy(u.c).add(u.c.clone().negate().applyQuaternion(q)).add(u.off.clone().multiplyScalar(e))}}
const unfoldBtn=document.getElementById('unfold');
unfoldBtn.onclick=()=>{unfoldTarget=unfoldTarget?0:1;unfoldBtn.setAttribute('aria-pressed',!!unfoldTarget);unfoldBtn.textContent=unfoldTarget?'Fold':'Unfold';
  if(unfoldTarget){fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:W(8.1,28.5,8.0),t1:W(8.1,65.6,4.0),s:0};document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',false))}else goView('all')};
function animate(dt){if(unfoldT!==unfoldTarget){unfoldT=unfoldTarget?Math.min(1,unfoldT+dt/1.3):Math.max(0,unfoldT-dt/1.3);placeRuns()}let moving=false;for(const f of fronts){const k=1-Math.exp(-dt*7);const o=f.open+(f.target-f.open)*k;if(Math.abs(o-f.open)>1e-4)moving=true;f.open=Math.abs(f.target-o)<1e-3?f.target:o;
  if(f.origin){f.g.quaternion.setFromAxisAngle(f.axis,f.sign*f.maxA*f.open)}else{f.g.position.copy(f.dir).multiplyScalar(f.maxT*f.open)}}return moving}
document.getElementById('openAll').onclick=()=>fronts.forEach(f=>toggle(f,1));document.getElementById('closeAll').onclick=()=>fronts.forEach(f=>toggle(f,0));
const sizesBtn=document.getElementById('sizes');sizesBtn.onclick=()=>{const on=sizesBtn.getAttribute('aria-pressed')!=='true';sizesBtn.setAttribute('aria-pressed',on);view.classList.toggle('nolab',!on)};

// views
const VIEWS={all:{p:[17.2,61.2,7.6],t:[7.0,63.0,3.2]},east:{p:[12.6,62.6,5.6],t:[4.2,62.8,3.2]},back:{p:[8.6,59.6,5.6],t:[8.0,66.0,2.6]},bf:{p:[9.0,66.0,6.2],t:[9.0,59.6,2.0]},up:{p:[11.0,61.0,4.6],t:[6.0,65.4,7.0]}};
let fly=null;function goView(k){const v=VIEWS[k];fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:W(...v.p),t1:W(...v.t),s:0};document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===k))}
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>goView(b.dataset.v));
camera.position.copy(W(...VIEWS.all.p));controls.target.copy(W(...VIEWS.all.t));
// ---------------- panel: unit list with sizes, needs and notes ----------------
const panel=document.getElementById('panel');
{const runs=[...new Set(K.modules.map(m=>m.run))];let h='<h2>Units</h2><div class="sub">W × H × D in mm (front width, height from the floor or the unit height, depth). Click a row to open that unit.</div>';
 for(const run of runs){h+=`<h2>${run}</h2><table class="t">`;for(const m of K.modules.filter(m=>m.run===run)){const fr=frame(m),base=m.z1<1,low=m.run==='Low counter',bf=m.run==='Breakfast counter';
   const uA=Math.min(...m.fronts.map(f=>f.a)),uB=Math.max(...m.fronts.map(f=>f.b)),Hh=base?(low?K.KLOW:bf?K.KBF+0.13:K.KCH):m.z2-m.z1;
   const fl=m.fronts.filter(f=>f.k!=='blind').map(f=>`${f.k==='drawer'?'drawer':f.k==='pullout'?'pull-out':f.k==='lift'?'lift-up':'door'} ${MM(f.b-f.a)}×${MM(f.zb-f.za)}: ${f.what}`).join('<br>');
   h+=`<tr class="mod" data-id="${m.id}"><td class="c">${m.id}</td><td><b>${m.name}</b><br><span class="sub">${MM(uB-uA)} × ${MM(Hh)} × ${MM(fr.D)} mm · ${FI(uB-uA)} × ${FI(Hh)} × ${FI(fr.D)}</span><br>${fl}<br><span class="sub">Inside: ${m.inside}</span><br><span class="sub">For: ${m.need}</span></td></tr>`}h+='</table>'}
 h+='<h2>Design notes</h2><ul>'+K.notes.map(n=>`<li>${n}</li>`).join('')+'</ul>';panel.innerHTML=h;
 panel.querySelectorAll('tr.mod').forEach(tr=>tr.onclick=()=>select(tr.dataset.id,true))}
function select(id,openIt){panel.querySelectorAll('tr.mod').forEach(tr=>tr.classList.toggle('sel',tr.dataset.id===id));const rec=modules.find(r=>r.m.id===id);if(!rec)return;
  if(openIt){const any=rec.fronts.some(f=>f.target);rec.fronts.forEach(f=>f.kind!=='blind'&&toggle(f,any?0:1));
    const c=rec.fr.toPlan((rec.fr.U0+rec.fr.U1)/2,rec.fr.D/2),zc=(rec.zb0+rec.zt)/2,o=rec.fr.toPlan((rec.fr.U0+rec.fr.U1)/2,-7.5);fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:W(o[0],o[1],zc+2.6),t1:W(c[0],c[1],zc),s:0}}
  const row=panel.querySelector(`tr[data-id="${id}"]`);if(row&&!openIt)row.scrollIntoView({block:'nearest',behavior:'smooth'})}
const panelBtn=document.getElementById('panelBtn');panelBtn.onclick=()=>{const on=panelBtn.getAttribute('aria-pressed')!=='true';panelBtn.setAttribute('aria-pressed',on);panel.classList.toggle('off',!on);resize()};
// ---------------- loop ----------------
let frameRatio='fill';
function resize(){const vw=view.clientWidth,vh=view.clientHeight;let w=vw,h=vh;if(frameRatio!=='fill'){const [a,b]=frameRatio.split(':').map(Number),r=a/b;w=Math.min(vw,vh*r);h=w/r}
  w=Math.max(1,Math.floor(w));h=Math.max(1,Math.floor(h));const L=Math.round((vw-w)/2)+'px',Tp=Math.round((vh-h)/2)+'px';renderer.setSize(w,h);labels.setSize(w,h);
  for(const el of [renderer.domElement,labels.domElement]){el.style.left=L;el.style.top=Tp}view.classList.toggle('framed',frameRatio!=='fill');
  camera.aspect=w/h;camera.fov=w>=h?45:Math.min(70,45/(w/h)*0.75);camera.updateProjectionMatrix()}
function setRatio(k){frameRatio=/^\d+:\d+$/.test(k)?k:'fill';document.querySelectorAll('#ratioSeg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.r===frameRatio));try{localStorage.setItem('kt-ratio',frameRatio)}catch(e){};resize()}
document.querySelectorAll('#ratioSeg button').forEach(x=>x.onclick=()=>setRatio(x.dataset.r));
{let k='fill';try{k=localStorage.getItem('kt-ratio')||k}catch(e){};frameRatio=/^\d+:\d+$/.test(k)?k:'fill';document.querySelectorAll('#ratioSeg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.r===frameRatio))}
addEventListener('resize',resize);resize();
let last=performance.now();
renderer.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min(0.05,(now-last)/1000);last=now;
  if(fly){fly.s=Math.min(1,fly.s+dt/0.9);const e=fly.s*fly.s*(3-2*fly.s);camera.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.t0,fly.t1,e);if(fly.s>=1)fly=null}
  animate(dt);controls.update();renderer.render(scene,camera);labels.render(scene,camera)});
window.__k={fronts,modules,toggle,goView,scene,camera,RUN,unfold:()=>unfoldBtn.click()};
