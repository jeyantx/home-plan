<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Room 3D</title>
<style>
:root{--bg:#f4f2ee;--panel:#ffffff;--ink:#1f2328;--muted:#5d646d;--line:#dcd8d0;--accent:#2f6f4f;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181b;--panel:#1f2226;--ink:#e8e6e1;--muted:#a3a8ae;--line:#33373c;--accent:#5fb08a;--accent-ink:#0d1a13}}
:root[data-theme="dark"]{--bg:#16181b;--panel:#1f2226;--ink:#e8e6e1;--muted:#a3a8ae;--line:#33373c;--accent:#5fb08a;--accent-ink:#0d1a13}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:2}
h1{font-size:16px;margin:0}
.sub{color:var(--muted);font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 11px;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.lbl{font-size:12px;color:var(--muted);margin-right:-6px}
#view{flex:1;position:relative;min-height:0}
canvas{display:block;width:100%;height:100%}
#tip{position:fixed;pointer-events:none;background:#1f2328;color:#fff;font-size:12.5px;padding:6px 9px;border-radius:7px;display:none;max-width:320px;z-index:5}
#tip b{color:#9fe0bf}
#panel.hidden{display:none}
#panel{position:absolute;right:12px;top:12px;width:300px;max-height:calc(100% - 24px);overflow:auto;background:rgba(255,255,255,.93);color:#1f2328;border:1px solid #dcd8d0;border-radius:10px;padding:12px 14px;font-size:12.5px}
#panel h2{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#5d646d;margin:6px 0}
#panel ul{margin:0;padding-left:16px}#panel li{margin:3px 0}
#panel .sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #0002;vertical-align:-2px;margin-right:5px}
#hide{position:absolute;right:12px;top:12px;z-index:3}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
</head><body>
<div id="app">
<header>
 <div><h1>Living room · Japandi 3D</h1><div class="sub">Built from the approved plan. Drag to look around, scroll to zoom, right-drag to move. Hover for names.</div></div>
 <span class="lbl">Option</span><div class="seg" id="optSeg"><button data-o="0">1 · Warm oak</button><button data-o="1">2 · Soft stone</button><button data-o="2">3 · Sage calm</button></div>
 <span class="lbl">Light</span><div class="seg" id="lightSeg"><button data-l="day">Day</button><button data-l="eve">Evening</button></div>
 <span class="lbl">View</span><div class="seg" id="camSeg"><button data-c="0">Entry</button><button data-c="1">From sofa</button><button data-c="2">From TV</button><button data-c="3">From kitchen</button><button data-c="4">Top</button></div>
 <button class="btn" id="notesBtn" aria-pressed="false">Notes</button>
 <button class="btn" id="aoBtn" aria-pressed="true" title="Soft contact shadows (slower)">Soft shadows: on</button>
</header>
<div id="view"><div id="loading">Loading 3D…</div><div id="panel" class="hidden"></div></div>
</div>
<div id="tip"></div>
<script>window.PLAN=__PLAN__;</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const P=window.PLAN, F=0.3048, CEIL=10.0, BAND_W=1.25, BAND_D=0.6;   // feet
const m=v=>v*F, mx=v=>-v*F;   // plan X grows toward the west = three -x (keeps east on the right side of the world)
const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.shadowMap.autoUpdate=false; renderer.shadowMap.needsUpdate=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
view.appendChild(renderer.domElement);
RectAreaLightUniformsLib.init();
const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(55,1,0.05,200);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;

let dirty=true,hqDone=false,lastChange=0;function invalidate(){dirty=true}
// ---------------- procedural textures ----------------
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function canvasTex(w,h,draw,repeatX=1,repeatY=1,srgb=true){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeatX,repeatY);
  t.anisotropy=renderer.capabilities.getMaxAnisotropy(); if(srgb) t.colorSpace=THREE.SRGBColorSpace; return t;
}
function shade(hex,k){const c=new THREE.Color(hex);c.offsetHSL(0,0,k);return '#'+c.getHexString()}
function noiseFill(g,w,h,base,amp,seed,size=2){const r=rng(seed);g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<w*h/(size*size*3);i++){const x=r()*w,y=r()*h,v=(r()-.5)*amp;g.fillStyle=v>0?`rgba(255,255,255,${v})`:`rgba(0,0,0,${-v})`;g.fillRect(x,y,size,size)}}
// wood-look plank tiles: canvas = 2' across (3 planks of 8") by 4' along
function woodTiles(base,seed){return canvasTex(768,1536,(g,w,h)=>{const r=rng(seed);const pw=w/3;
  for(let p=0;p<3;p++){const off=r()*h;for(let seg=0;seg<2;seg++){const y0=(off+seg*h/2)%h;const col=shade(base,(r()-.5)*0.06);
    const len=h/2;for(const yy of [y0-h,y0]){g.fillStyle=col;g.fillRect(p*pw,yy,pw,h/2);
      for(let k=0;k<70;k++){const x=p*pw+r()*pw;g.strokeStyle=`rgba(${r()<.5?'90,60,30':'255,240,220'},${0.04+r()*0.06})`;g.lineWidth=0.6+r()*1.6;g.beginPath();g.moveTo(x,yy);for(let t=0;t<=20;t++){g.lineTo(x+Math.sin(t*0.6+k)*3*r(),yy+t*len/20)}g.stroke()}
      if(r()<.5){g.fillStyle='rgba(90,60,30,0.10)';g.beginPath();g.ellipse(p*pw+pw*(.3+.4*r()),yy+len*r(),6,14,0,0,7);g.fill()}}
    g.fillStyle='rgba(60,45,30,0.55)';g.fillRect(p*pw,y0-1,pw,2)}
  g.fillStyle='rgba(60,45,30,0.6)';g.fillRect(p*pw-1,0,2,h)}})}
function stoneTiles(base,seed,tilesX,tilesY){return canvasTex(1024,1024*tilesY/tilesX,(g,w,h)=>{noiseFill(g,w,h,base,0.05,seed,3);
  const r=rng(seed+9);for(let i=0;i<220;i++){g.fillStyle=`rgba(${r()<.5?'255,255,255':'120,110,95'},0.05)`;g.beginPath();g.ellipse(r()*w,r()*h,8+r()*40,4+r()*20,r()*3,0,7);g.fill()}
  g.fillStyle='rgba(120,112,100,0.55)';for(let i=0;i<=tilesX;i++)g.fillRect(i*w/tilesX-1.5,0,3,h);for(let j=0;j<=tilesY;j++)g.fillRect(0,j*h/tilesY-1.5,w,3)})}
function plaster(base,seed){return canvasTex(512,512,(g,w,h)=>noiseFill(g,w,h,base,0.035,seed,2))}
function fabric(base,seed){return canvasTex(256,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let y=0;y<h;y+=2){g.fillStyle=y%4?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.06)';g.fillRect(0,y,w,1)}for(let x=0;x<w;x+=2){g.fillStyle=x%4?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.04)';g.fillRect(x,0,1,h)}noiseFill(g,0,0,base,0,seed)})}
function oak(base,seed){return canvasTex(512,512,(g,w,h)=>{const r=rng(seed);g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let k=0;k<90;k++){const y=r()*h;g.strokeStyle=`rgba(${r()<.6?'110,75,40':'255,245,225'},${0.05+r()*0.07})`;g.lineWidth=0.6+r()*1.8;g.beginPath();g.moveTo(0,y);for(let t=0;t<=24;t++)g.lineTo(t*w/24,y+Math.sin(t*0.5+k)*4*r());g.stroke()}})}
function jute(base,seed){return canvasTex(256,256,(g,w,h)=>{const r=rng(seed);g.fillStyle=base;g.fillRect(0,0,w,h);for(let y=0;y<h;y+=6)for(let x=0;x<w;x+=6){g.fillStyle=`rgba(${(x+y)%12?'255,250,235':'90,70,40'},${0.08+r()*0.08})`;g.fillRect(x,y,5,5)}})}

// ---------------- options (Japandi) ----------------
const OPTIONS=[
 {name:'Warm oak',floor:'wood',floorCol:'#cfae86',wall:'#f2ede4',accent:'#d9cfc0',accentWall:'niche',tvPanel:'#c49a6c',sofa:'#d8cfc0',rug:'#c8b48f',
  notes:['Floor: light-oak wood-look porcelain planks, 8" x 48" (tile cost, wood look)','Walls: warm white emulsion; TV niches in soft greige','TV wall: civil-work niches + oak-laminate centre panel (mid-range)','Sofa: oatmeal fabric, oak legs; jute rug'],
  sw:['#cfae86','#f2ede4','#d9cfc0','#c49a6c']},
 {name:'Soft stone',floor:'stone',floorCol:'#d8cfc2',tilesX:1,tilesY:2,wall:'#f4f1ec',accent:'#cfc6b8',accentWall:'east',tvPanel:'#b88c62',sofa:'#9c9890',rug:'#d9ccb4',
  notes:['Floor: matte warm-beige 2\' x 4\' vitrified tiles','Walls: off-white; window wall in greige for a soft backdrop','TV wall: same civil niches, slightly darker oak panel','Sofa: warm grey fabric; light rug'],
  sw:['#d8cfc2','#f4f1ec','#cfc6b8','#9c9890']},
 {name:'Sage calm',floor:'stone',floorCol:'#cdcac3',tilesX:2,tilesY:2,wall:'#f3f2ee',accent:'#a9b5a0',accentWall:'tv',tvPanel:'#c9a57c',sofa:'#e6dfd2',rug:'#bfb59f',
  notes:['Floor: light grey matte 2\' x 2\' tiles (lowest cost)','Walls: white; TV wall painted soft sage green','TV wall: sage paint with light-oak shelves and console','Sofa: cream fabric; black metal accents'],
  sw:['#cdcac3','#f3f2ee','#a9b5a0','#e6dfd2']},
];

// ---------------- materials ----------------
const MAT={};
function std(o){return new THREE.MeshStandardMaterial(o)}
MAT.ceiling=std({color:'#fbfaf7',roughness:0.95});
MAT.otherFloor=std({map:stoneTiles('#e7e2da',5,2,2),roughness:0.6});
MAT.wallOut=std({color:'#ece6dc',roughness:0.95});
MAT.white=std({color:'#f7f6f3',roughness:0.9});
MAT.upvc=std({color:'#f4f4f2',roughness:0.4});
MAT.blackMetal=std({color:'#1e1f22',roughness:0.45,metalness:0.6});
MAT.glass=std({color:'#dfe9ee',roughness:0.05,metalness:0.0,transparent:true,opacity:0.16,envMapIntensity:1.5,depthWrite:false});
MAT.oak=std({map:oak('#c8a27a',3),roughness:0.55});
MAT.oakDark=std({map:oak('#9a7350',4),roughness:0.55});
MAT.teak=std({map:oak('#7a4f2c',6),roughness:0.5});
MAT.granite=std({color:'#2b2d30',roughness:0.25,metalness:0.1});
MAT.cabinet=std({color:'#ece7de',roughness:0.6});
MAT.screen=std({color:'#0b0c0e',roughness:0.15,metalness:0.4});
MAT.grass=std({color:'#6f8f4e',roughness:1});
MAT.paving=std({map:stoneTiles('#bdb6aa',7,2,2),roughness:0.9});
MAT.neighbour=std({color:'#d9cdb8',roughness:0.95});
MAT.compound=std({color:'#cfc8bb',roughness:0.95});
MAT.leaf=std({color:'#4f7a3a',roughness:0.7,side:THREE.DoubleSide});
MAT.pot=std({color:'#d8d2c6',roughness:0.85});
MAT.paper=std({color:'#fff6e6',emissive:'#ffcf8a',emissiveIntensity:0,roughness:0.9,side:THREE.DoubleSide});
MAT.curtain=std({color:'#f3eee6',roughness:1,side:THREE.DoubleSide,transparent:true,opacity:0.82});
MAT.led=std({color:'#ffffff',emissive:'#ffd29a',emissiveIntensity:0});
// option-driven materials (replaced on switch)
MAT.floor=std({roughness:0.55});MAT.wall=std({roughness:0.95});MAT.accent=std({roughness:0.95});MAT.sofa=std({roughness:0.95});MAT.rug=std({roughness:1});MAT.tvPanel=std({roughness:0.55});MAT.skirt=std({roughness:0.6});

// ---------------- helpers ----------------
const tipTargets=[];
function named(mesh,tip){mesh.userData.tip=tip;tipTargets.push(mesh);return mesh}
function box(x1,x2,y1,y2,z1,z2,mat,o={}){ // plan x, plan y, height z (feet)
  const g=o.round?new RoundedBoxGeometry(m(x2-x1),m(z2-z1),m(y2-y1),3,m(o.round)):new THREE.BoxGeometry(m(x2-x1),m(z2-z1),m(y2-y1));
  const me=new THREE.Mesh(g,mat);me.position.set(mx((x1+x2)/2),m((z1+z2)/2),m((y1+y2)/2));
  me.castShadow=o.cast!==false;me.receiveShadow=true;scene.add(me);if(o.tip)named(me,o.tip);return me}
function cyl(x,y,z1,z2,r,mat,o={}){const g=new THREE.CylinderGeometry(m(o.rTop??r),m(r),m(z2-z1),o.seg||24);const me=new THREE.Mesh(g,mat);me.position.set(mx(x),m((z1+z2)/2),m(y));me.castShadow=true;me.receiveShadow=true;scene.add(me);if(o.tip)named(me,o.tip);return me}
const wallsG=Object.fromEntries(P.walls.G.map(w=>[w.id,w]));
const roomsG=Object.fromEntries(P.rooms.G.map(r=>[r.id,r]));
const fuG=Object.fromEntries(P.furniture.filter(f=>f.fl==='G').map(f=>[f.id,f]));
const LIVING=roomsG['G-04'];
const COMMON=new Set(['G-03','G-04','G-09','G-10']);

// ---------------- walls with openings ----------------
const floorOpen=t=>['door','double','arch','frame'].includes(t);
function buildWall(w){
  if(['comp','pillar','planter','para'].includes(w.kind)) return;
  const horiz=(w.x2-w.x1)>(w.y2-w.y1);
  const L=horiz?w.x2-w.x1:w.y2-w.y1, T=horiz?w.y2-w.y1:w.x2-w.x1, s0=horiz?w.x1:w.y1;
  const ops=P.openings.filter(o=>o.fl==='G'&&o.wall===w.id).map(o=>({...o,u1:o.a-s0,u2:o.b-s0})).sort((a,b)=>a.u1-b.u1);
  const shape=new THREE.Shape();shape.moveTo(0,0);
  for(const o of ops.filter(o=>floorOpen(o.type))){
    shape.lineTo(o.u1,0);
    if(o.type==='arch'){const r=(o.u2-o.u1)/2,spring=o.h-r;shape.lineTo(o.u1,spring);shape.absarc(o.u1+r,spring,r,Math.PI,0,true);shape.lineTo(o.u2,0)}
    else{shape.lineTo(o.u1,o.h);shape.lineTo(o.u2,o.h);shape.lineTo(o.u2,0)}
  }
  shape.lineTo(L,0);shape.lineTo(L,CEIL);shape.lineTo(0,CEIL);shape.lineTo(0,0);
  for(const o of ops.filter(o=>!floorOpen(o.type))){const h=new THREE.Path();h.moveTo(o.u1,o.sill);h.lineTo(o.u2,o.sill);h.lineTo(o.u2,o.sill+o.h);h.lineTo(o.u1,o.sill+o.h);h.lineTo(o.u1,o.sill);shape.holes.push(h)}
  const g=new THREE.ExtrudeGeometry(shape,{depth:T,bevelEnabled:false,steps:1});g.scale(F,F,F);
  const inLiving=touchesLiving(w);
  const me=new THREE.Mesh(g,inLiving?[MAT.wall,MAT.wall]:[MAT.white,MAT.white]);
  if(horiz){me.rotation.y=Math.PI;me.position.set(mx(w.x1),0,m(w.y2))}else{me.rotation.y=-Math.PI/2;me.position.set(mx(w.x1),0,m(w.y1))}
  me.castShadow=true;me.receiveShadow=true;scene.add(me);named(me,`${w.id} · ${w.desc}`);me.userData.wall=w;
  for(const o of ops) buildOpening(o,w,horiz,s0);
}
function touchesLiving(w){const pad=0.8,[a,b]=[LIVING.pts[0],LIVING.pts[2]];return !(w.x2<a[0]-pad||w.x1>b[0]+pad||w.y2<a[1]-pad||w.y1>b[1]+pad)}

// windows / doors fixtures
function along(horiz,w,u,v,z){ // u along wall from s0, v across (0..T), z height -> plan coords
  return horiz?[w.x1+u,w.y1+v,z]:[w.x1+v,w.y1+u,z]}
function boxAlong(horiz,w,u1,u2,v1,v2,z1,z2,mat,o){
  if(horiz) return box(w.x1+u1,w.x1+u2,w.y1+v1,w.y1+v2,z1,z2,mat,o);
  return box(w.x1+v1,w.x1+v2,w.y1+u1,w.y1+u2,z1,z2,mat,o)}
function buildOpening(o,w,horiz,s0){
  const T=horiz?w.y2-w.y1:w.x2-w.x1, u1=o.a-s0,u2=o.b-s0, tip=`${o.id} · ${o.note}${P.spec[o.id]?' · '+P.spec[o.id]:''}`;
  if(o.type==='window'||o.type==='vent'){
    const z1=o.sill,z2=o.sill+o.h,fw=0.22, v0=T*0.35, v1=v0+0.28;
    // UPVC frame
    boxAlong(horiz,w,u1,u2,v0,v1,z1,z1+fw,MAT.upvc,{tip});boxAlong(horiz,w,u1,u2,v0,v1,z2-fw,z2,MAT.upvc,{tip});
    boxAlong(horiz,w,u1,u1+fw,v0,v1,z1,z2,MAT.upvc,{tip});boxAlong(horiz,w,u2-fw,u2,v0,v1,z1,z2,MAT.upvc,{tip});
    if(o.type==='window'){const mid=(u1+u2)/2;boxAlong(horiz,w,mid-0.07,mid+0.07,v0,v1,z1,z2,MAT.upvc,{tip});}
    const gl=boxAlong(horiz,w,u1+fw,u2-fw,v0+0.12,v0+0.15,z1+fw,z2-fw,MAT.glass,{tip,cast:false});gl.castShadow=false;
    // MS grill on the outer side
    const vo=T-0.06;for(let u=u1+0.35;u<u2-0.2;u+=0.42) boxAlong(horiz,w,u-0.03,u+0.03,vo-0.06,vo,z1,z2,MAT.blackMetal,{tip:'MS safety grill'});
    boxAlong(horiz,w,u1,u2,vo-0.06,vo,z1+o.h*0.5-0.04,z1+o.h*0.5+0.04,MAT.blackMetal,{tip:'MS safety grill'});
    // sill
    boxAlong(horiz,w,u1-0.1,u2+0.1,-0.12,T*0.35,z1-0.08,z1,MAT.granite,{tip:'Granite window sill'});
  } else if(o.type==='fold'){
    const z1=o.sill,z2=o.sill+o.h,n=4,v0=T*0.4;
    for(let i=0;i<=n;i++){const u=u1+i*(u2-u1)/n;boxAlong(horiz,w,u-0.06,u+0.06,v0,v0+0.15,z1,z2,MAT.blackMetal,{tip})}
    boxAlong(horiz,w,u1,u2,v0,v0+0.15,z1,z1+0.1,MAT.blackMetal,{tip});boxAlong(horiz,w,u1,u2,v0,v0+0.15,z2-0.1,z2,MAT.blackMetal,{tip});
    const gl=boxAlong(horiz,w,u1,u2,v0+0.06,v0+0.09,z1+0.1,z2-0.1,MAT.glass,{tip,cast:false});gl.castShadow=false;
    boxAlong(horiz,w,u1-0.1,u2+0.1,-0.15,T+0.05,z1-0.1,z1,MAT.oak,{tip:'Oak ledge under the folding glass'});
  } else if(o.type==='door'||o.type==='double'){

  scene.traverse(n=>{if(n.isMesh&&n.userData.wall&&touchesLiving(n.userData.wall)){n.material=(o.accentWall==='east'&&n.userData.wall.id==='GW-01')?[MAT.accent,MAT.accent]:[MAT.wall,MAT.wall]}});
  if(o.accentWall==='tv'){MAT.tvPanel.map=plaster(o.accent,36);MAT.tvPanel.color.set('#ffffff')}
  panel.innerHTML=`<h2>Option ${i+1} · ${o.name}</h2><div>${o.sw.map(c=>`<span class="sw" style="background:${c}"></span>`).join('')}</div><ul>${o.notes.map(n=>`<li>${n}</li>`).join('')}</ul>
  <h2>Same in all options</h2><ul>
  <li><b>Ceiling:</b> no false ceiling. A civil-work band 1'3" wide and 7" deep runs round the edge, plastered and painted, with a warm LED strip in its cove and 6 recessed downlights. Clear height is 10' in the middle and 9'5" under the band.</li>
  <li><b>TV wall FU-05:</b> two masonry niche towers (civil work) with oak shelf edges and a base cupboard, an oak-laminate centre wall, a floating console and a 55" TV.</li>
  <li><b>Windows:</b> UPVC sliding with MS grill and a granite sill. Sheer linen curtains hang from the band.</li>
  <li><b>Kitchen glass W-12:</b> black bi-fold frames with an oak ledge. <b>Arch O-01:</b> round-top plastered arch.</li>
  <li><b>Fan:</b> 48", wood-finish blades. <b>Lamp:</b> paper floor lamp in the sofa corner, with a plant.</li>
  </ul><div style="margin-top:8px;color:#5d646d">The textures are procedural and only approximate the real tiles. Colours and sizes are what matter.</div>`;
  document.querySelectorAll('#optSeg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.o===i));
  try{localStorage.setItem('lr3d-opt',i)}catch(e){}
  renderer.shadowMap.needsUpdate=true;invalidate();
}
function applyLight(mode){const day=mode==='day';
  sun.intensity=day?4.2:0;hemi.intensity=day?0.55:0.04;scene.environmentIntensity=day?0.55:0.06;
  scene.background=new THREE.Color(day?'#cfe3f6':'#0d1626');
  coveLights.forEach(l=>{l.intensity=day?0:9;l.visible=!day});towerLights.forEach(l=>{l.intensity=day?0:2.5;l.visible=!day});downs.forEach(s=>{s.intensity=day?0:22;s.visible=!day});
  MAT.led.emissiveIntensity=day?0:3;MAT.paper.emissiveIntensity=day?0:1.6;lampLight.intensity=day?0:14;lampLight.visible=!day;sun.visible=day;renderer.shadowMap.needsUpdate=true;invalidate();
  renderer.toneMappingExposure=day?1.0:1.15;
  document.querySelectorAll('#lightSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===mode));
  try{localStorage.setItem('lr3d-light',mode)}catch(e){}
}
const VIEWS=[
 {p:[5.2,5.3,47.3],t:[19.0,3.8,54.5]},   // entry, just inside from the foyer
 {p:[4.9,3.7,51.2],t:[20.2,4.4,52.8]},   // seated on the 3-seater, looking at TV
 {p:[18.2,5.3,49.0],t:[4.0,3.6,55.0]},   // from TV wall to sofa and windows
 {p:[16.0,5.3,66.0],t:[11.8,3.8,50.0]},  // from the open area through the arch
 {p:[11.9,30,52.75],t:[11.9,0,52.76]},   // top
];
function setView(i){const v=VIEWS[i];camera.position.set(mx(v.p[0]),m(v.p[1]),m(v.p[2]));controls.target.set(mx(v.t[0]),m(v.t[1]),m(v.t[2]));controls.update();
  document.querySelectorAll('#camSeg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.c===i));invalidate()}
document.querySelectorAll('#optSeg button').forEach(b=>b.onclick=()=>applyOption(+b.dataset.o));
document.querySelectorAll('#lightSeg button').forEach(b=>b.onclick=()=>applyLight(b.dataset.l));
document.querySelectorAll('#camSeg button').forEach(b=>b.onclick=()=>setView(+b.dataset.c));
const nb=document.getElementById('notesBtn');nb.onclick=()=>{const h=panel.classList.toggle('hidden');nb.setAttribute('aria-pressed',!h)};
const aoBtn=document.getElementById('aoBtn');aoBtn.onclick=()=>{useAO=!useAO;aoBtn.textContent='Soft shadows: '+(useAO?'on':'off');aoBtn.setAttribute('aria-pressed',useAO);invalidate()};
let so=0,sl='day';try{so=+(localStorage.getItem('lr3d-opt')||0);sl=localStorage.getItem('lr3d-light')||'day'}catch(e){}
applyOption(so);applyLight(sl);setView(0);

// ---------------- hover names ----------------
const tipEl=document.getElementById('tip'),ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
let hoverPending=false;renderer.domElement.addEventListener('pointermove',e=>{if(hoverPending||e.buttons)return;hoverPending=true;requestAnimationFrame(()=>hoverPending=false);const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(tipTargets,false)[0];if(!hit){tipEl.style.display='none';return}
  const s=hit.object.userData.tip,i=s.indexOf(' · ');tipEl.innerHTML=i>0?'<b>'+s.slice(0,i)+'</b> · '+s.slice(i+3).replace(/ · /g,'<br>'):s;
  tipEl.style.display='block';tipEl.style.left=Math.min(e.clientX+14,innerWidth-330)+'px';tipEl.style.top=(e.clientY+14)+'px'});
renderer.domElement.addEventListener('pointerleave',()=>tipEl.style.display='none');

// ---------------- resize and loop ----------------
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);composer.setSize(w,h);gtao.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();invalidate()}
addEventListener('resize',resize);resize();
document.getElementById('loading').remove();
controls.addEventListener('change',invalidate);
renderer.setAnimationLoop(()=>{
  controls.update();
  const now=performance.now();
  if(dirty){renderer.render(scene,camera);dirty=false;lastChange=now;hqDone=false;}
  else if(!hqDone&&now-lastChange>220){ if(useAO) composer.render(); else renderer.render(scene,camera); hqDone=true; }
});
window.__ready=true;
window.__bench=()=>{const gl=renderer.getContext();const t=(f,n)=>{gl.finish();const a=performance.now();for(let i=0;i<n;i++)f();gl.finish();return ((performance.now()-a)/n).toFixed(1)+' ms'};
  return {fast:t(()=>renderer.render(scene,camera),20),softShadows:t(()=>composer.render(),5),calls:renderer.info.render.calls,triangles:renderer.info.render.triangles}};
</script>
