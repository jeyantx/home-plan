<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Room 3D</title>
<style>
:root{--bg:#f4f2ee;--panel:#ffffff;--ink:#1f2328;--muted:#5d646d;--line:#dcd8d0;--accent:#2f6f4f;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181b;--panel:#1f2226;--ink:#e8e6e1;--muted:#a3a8ae;--line:#33373c;--accent:#5fb08a;--accent-ink:#0d1a13}}
:root[data-theme="dark"]{--bg:#16181b;--panel:#1f2226;--ink:#e8e6e1;--muted:#a3a8ae;--line:#33373c;--accent:#5fb08a;--accent-ink:#0d1a13}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);z-index:2}
h1{font-size:15px;margin:0}
.sub{color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.lbl{font-size:12px;color:var(--muted);margin-right:-6px}
#view{flex:1;position:relative;min-height:0}
canvas{display:block;width:100%;height:100%}
#tip{position:fixed;pointer-events:none;background:#1f2328;color:#fff;font-size:12.5px;padding:6px 9px;border-radius:7px;display:none;max-width:320px;z-index:5}
#tip b{color:#9fe0bf}
#panel{position:absolute;right:12px;top:12px;width:310px;max-height:calc(100% - 24px);overflow:auto;background:rgba(255,255,255,.94);color:#1f2328;border:1px solid #dcd8d0;border-radius:10px;padding:12px 14px;font-size:12.5px}
#panel.hidden{display:none}
#panel h2{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#5d646d;margin:6px 0}
#panel ul{margin:0;padding-left:16px}#panel li{margin:3px 0}
#panel .sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #0002;vertical-align:-2px;margin-right:5px}
#status{position:absolute;left:12px;bottom:12px;background:rgba(20,22,25,.78);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:8px;display:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
</style>
<script type="importmap">{"imports":{
 "three":"./vendor/three/build/three.module.js",
 "three/webgpu":"./vendor/three/build/three.webgpu.js",

<div id="app">
<header>
 <div><h1>Living room · Japandi 3D</h1><div class="sub">↑↓ walk · ←→ turn · A/D slide · W/S tilt · Q/E lower/raise · Shift faster · Drag to look around · Scroll to walk · Right-drag to slide · Hover for names</div></div>
 <span class="lbl">Light</span><div class="seg" id="lightSeg"><button data-l="day">Day</button><button data-l="eve">Evening</button></div>
 <span class="lbl">View</span><div class="seg" id="camSeg"><button data-c="0">Entry</button><button data-c="1">Corner</button><button data-c="2">From sofa</button><button data-c="3">From TV</button><button data-c="4">From kitchen</button><button data-c="5">Top</button></div>
 <span class="lbl">Grill</span><div class="seg" id="grillSeg"><button data-g="GR-1">GR-1 Bars</button><button data-g="GR-2">GR-2 Grid</button><button data-g="GR-3">GR-3 Flat lines</button><button data-g="GR-4">GR-4 Slats</button><button data-g="GR-5">GR-5 Shoji</button><button data-g="GR-6">GR-6 Diamond</button></div>
 <span class="lbl">Lens</span><div class="seg" id="lensSeg"><button data-f="60">Eye 60°</button><button data-f="75">Wide 75°</button></div>
 <button class="btn" id="photoBtn" aria-pressed="false" title="Ray-traced photo of the current view. Uses the graphics card heavily for about a minute, then stops by itself.">Photo</button>
 <button class="btn" id="saveBtn" title="Save the current image as PNG">Save image</button>
 <button class="btn" id="notesBtn" aria-pressed="false">Notes</button>
</header>

</div>

<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

const P=window.PLAN, F=0.3048, CEIL=10.0, EYE=5.25;
const m=v=>v*F, mx=v=>-v*F;   // plan X grows toward the west = three -x, so the world is not mirrored
const view=document.getElementById('view'), statusEl=document.getElementById('status');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap; renderer.shadowMap.autoUpdate=false; renderer.shadowMap.needsUpdate=true;

const scene=new THREE.Scene();

camera.rotation.order='YXZ'; let yaw=0, pitch=0;   // first-person look: the camera turns in place
const wallMeshes=[], ceilingMeshes=[];
let dirty=true,hqDone=false,lastChange=0;
let photo=false, pt=null; const PHOTO_SAMPLES=256;
function invalidate(){dirty=true;if(photo&&pt)pt.updateCamera()}

// ---------------- textures: real CC0 scans from Poly Haven, stored locally in assets/ ----------------
const loader=new THREE.TextureLoader(); let pending=0;
function tex(path,srgb,repeatM){pending++;const t=loader.load(path,()=>{pending--;renderer.shadowMap.needsUpdate=true;invalidate()},undefined,()=>{pending--});
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1/repeatM,1/repeatM);t.anisotropy=8;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t}
function pbr(name,sizeM,withMap=true){const b=`assets/textures/${name}/${name}_`;
  return {map:withMap?tex(b+'diff_1k.jpg',true,sizeM):null,normalMap:tex(b+'nor_gl_1k.jpg',false,sizeM),roughnessMap:tex(b+'rough_1k.jpg',false,sizeM)}}
const T={
  floorOak:pbr('laminate_floor_02',1.70),
  oak:pbr('white_oak_veneer',0.50),
  oakPanel:pbr('oak_veneer_01',1.83),
  linen:pbr('rough_linen',0.27),
  sheer:pbr('crepe_georgette',0.26,false),
  jute:pbr('hessian_230',0.27),
  paint:pbr('ceiling_interior',2.0,false),

function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function canvasTex(w,h,draw,sizeM){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1/sizeM,1/sizeM);t.anisotropy=8;t.colorSpace=THREE.SRGBColorSpace;return t}
function stoneTiles(base,seed,tx,ty,tileFt){return canvasTex(1024,1024*ty/tx,(g,w,h)=>{const r=rng(seed);g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){const v=(r()-.5)*0.05;g.fillStyle=v>0?`rgba(255,255,255,${v})`:`rgba(0,0,0,${-v})`;g.fillRect(r()*w,r()*h,3,3)}
  for(let i=0;i<220;i++){g.fillStyle=`rgba(${r()<.5?'255,255,255':'120,110,95'},0.05)`;g.beginPath();g.ellipse(r()*w,r()*h,8+r()*40,4+r()*20,r()*3,0,7);g.fill()}
  g.fillStyle='rgba(120,112,100,0.5)';for(let i=0;i<=tx;i++)g.fillRect(i*w/tx-1.5,0,3,h);for(let j=0;j<=ty;j++)g.fillRect(0,j*h/ty-1.5,w,3)},m(tileFt*tx))}
function shade(hex,k){const c=new THREE.Color(hex);c.offsetHSL(0,0,k);return '#'+c.getHexString()}

// ---------------- materials ----------------
const std=o=>new THREE.MeshStandardMaterial(o), phys=o=>new THREE.MeshPhysicalMaterial(o);
const paintN=new THREE.Vector2(0.06,0.06);   // smooth emulsion over plaster: only a hint of texture
const MAT={
  ceiling:std({color:'#fbfaf7',roughness:0.92,normalMap:T.paint.normalMap,normalScale:paintN}),
  otherFloor:std({map:stoneTiles('#e7e2da',5,2,2,2),roughness:0.6}),
  wallOut:std({color:'#ece6dc',roughness:0.95}),
  white:std({color:'#f6f4f0',roughness:0.9,normalMap:T.paint.normalMap,normalScale:paintN}),
  upvc:std({color:'#f2f2f0',roughness:0.35}),
  blackMetal:std({color:'#1d1e21',roughness:0.4,metalness:0.7}),
  grill:std({color:'#1d1e21',roughness:0.45,metalness:0.6,side:THREE.DoubleSide}),
  glassRaster:std({color:'#dfe9ee',roughness:0.04,metalness:0,transparent:true,opacity:0.14,depthWrite:false}),
  glassPhoto:phys({color:'#ffffff',roughness:0.02,metalness:0,transmission:1,thickness:0.006,ior:1.5}),
  oak:std({map:T.oak.map,normalMap:T.oak.normalMap,normalScale:new THREE.Vector2(0.4,0.4),roughnessMap:T.oak.roughnessMap,roughness:0.8}),
  oakDark:std({map:T.oak.map,normalMap:T.oak.normalMap,color:'#b9997c',roughness:0.6}),
  teak:std({map:T.oakPanel.map,normalMap:T.oakPanel.normalMap,color:'#8a5f3c',roughness:0.5}),
  granite:std({color:'#2a2c2f',roughness:0.22,metalness:0.05}),
  cabinet:std({color:'#ece7de',roughness:0.55}),
  screen:std({color:'#08090a',roughness:0.12,metalness:0.3}),
  grass:std({color:'#6c8a4b',roughness:1}),
  paving:std({map:stoneTiles('#bdb6aa',7,2,2,2),roughness:0.9}),
  neighbour:std({color:'#ddd1bd',roughness:0.95}),
  compound:std({color:'#cfc8bb',roughness:0.95}),
  leaf:std({color:'#3b5f2f',roughness:0.55,side:THREE.DoubleSide}),
  pot:std({color:'#d6cfc2',roughness:0.85}),
  paper:std({color:'#fff6e6',emissive:'#ffcf8a',emissiveIntensity:0,roughness:0.9,side:THREE.DoubleSide}),
  sheerRaster:std({color:'#f5f0e8',roughness:1,side:THREE.DoubleSide,transparent:true,opacity:0.86,normalMap:T.sheer.normalMap,roughnessMap:T.sheer.roughnessMap}),
  sheerPhoto:phys({color:'#f8f3ea',roughness:0.95,side:THREE.DoubleSide,transmission:0.62,thickness:0.0005,ior:1.3,sheen:1,sheenRoughness:0.7,sheenColor:new THREE.Color('#ffffff'),normalMap:T.sheer.normalMap,roughnessMap:T.sheer.roughnessMap}),
  led:std({color:'#ffffff',emissive:'#ffcf94',emissiveIntensity:0}),
  floor:std({roughness:0.5}),
  wall:std({roughness:0.95,normalMap:T.paint.normalMap,normalScale:paintN}),
  accent:std({roughness:0.95,normalMap:T.paint.normalMap,normalScale:paintN}),
  sofa:std({normalMap:T.linen.normalMap,normalScale:new THREE.Vector2(0.8,0.8),roughnessMap:T.linen.roughnessMap,roughness:1}),   // weave from the scan, colour from the option
  sofaWood:std({map:T.oakPanel.map,normalMap:T.oakPanel.normalMap,normalScale:new THREE.Vector2(0.4,0.4),roughness:0.55,color:new THREE.Color(0.52,0.36,0.24)}),   // dark walnut-tone stain
  rug:std({map:T.jute.map,normalMap:T.jute.normalMap,roughnessMap:T.jute.roughnessMap,roughness:1}),
  tvPanel:std({map:T.oakPanel.map,normalMap:T.oakPanel.normalMap,roughnessMap:T.oakPanel.roughnessMap,roughness:0.8}),
  skirt:std({roughness:0.5}),
};
MAT.curtain=MAT.sheerRaster; MAT.glass=MAT.glassRaster;

// ---------------- helpers ----------------
const tipTargets=[];
function named(mesh,tip){mesh.userData.tip=tip;tipTargets.push(mesh);return mesh}
function box(x1,x2,y1,y2,z1,z2,mat,o={}){ // plan x, plan y, height z (feet)
  const g=o.round?new RoundedBoxGeometry(m(x2-x1),m(z2-z1),m(y2-y1),3,m(o.round)):new THREE.BoxGeometry(m(x2-x1),m(z2-z1),m(y2-y1));
  const me=new THREE.Mesh(g,mat);me.position.set(mx((x1+x2)/2),m((z1+z2)/2),m((y1+y2)/2));
  me.castShadow=o.cast!==false;me.receiveShadow=true;scene.add(me);if(o.tip)named(me,o.tip);return me}
function cyl(x,y,z1,z2,r,mat,o={}){const g=new THREE.CylinderGeometry(m(o.rTop??r),m(r),m(z2-z1),o.seg||32);const me=new THREE.Mesh(g,mat);me.position.set(mx(x),m((z1+z2)/2),m(y));me.castShadow=true;me.receiveShadow=true;scene.add(me);if(o.tip)named(me,o.tip);return me}
// world-size UVs: every surface gets UVs in metres, so a texture's repeat = 1 / its real size
function metreUV(geo){const p=geo.attributes.position,n=geo.attributes.normal;if(!p||!n)return;const uv=new Float32Array(p.count*2);
  for(let i=0;i<p.count;i++){const ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i)),az=Math.abs(n.getZ(i));let u,v;
    if(ay>=ax&&ay>=az){u=p.getX(i);v=p.getZ(i)}else if(ax>=az){u=p.getZ(i);v=p.getY(i)}else{u=p.getX(i);v=p.getY(i)}uv[2*i]=u;uv[2*i+1]=v}
  geo.setAttribute('uv',new THREE.BufferAttribute(uv,2))}
const roomsG=Object.fromEntries(P.rooms.G.map(r=>[r.id,r]));
const fuG=Object.fromEntries(P.furniture.filter(f=>f.fl==='G').map(f=>[f.id,f]));
const COMMON=new Set(['G-03','G-04','G-09','G-10']);
const LX1=3.5,LX2=20.25,LY1=46.75,LY2=58.75;

// ---------------- walls with openings ----------------
const floorOpen=t=>['door','double','arch','frame'].includes(t);
function touchesLiving(w){const pad=0.8;return !(w.x2<LX1-pad||w.x1>LX2+pad||w.y2<LY1-pad||w.y1>LY2+pad)}
function buildWall(w){
  if(['comp','pillar','planter','para'].includes(w.kind)) return;
  const horiz=(w.x2-w.x1)>(w.y2-w.y1);
  const L=horiz?w.x2-w.x1:w.y2-w.y1, T=horiz?w.y2-w.y1:w.x2-w.x1, s0=horiz?w.x1:w.y1;
  const ops=P.openings.filter(o=>o.fl==='G'&&o.wall===w.id).map(o=>({...o,u1:o.a-s0,u2:o.b-s0})).sort((a,b)=>a.u1-b.u1);
  const shape=new THREE.Shape();shape.moveTo(0,0);
  for(const o of ops.filter(o=>floorOpen(o.type))){
    shape.lineTo(o.u1,0);
    if(o.type==='arch'){const r=(o.u2-o.u1)/2,spring=o.h-r;shape.lineTo(o.u1,spring);shape.absarc(o.u1+r,spring,r,Math.PI,0,true);shape.lineTo(o.u2,0)}
    else{shape.lineTo(o.u1,o.h);shape.lineTo(o.u2,o.h);shape.lineTo(o.u2,0)}
  }
  shape.lineTo(L,0);shape.lineTo(L,CEIL);shape.lineTo(0,CEIL);shape.lineTo(0,0);
  for(const o of ops.filter(o=>!floorOpen(o.type))){const h=new THREE.Path();h.moveTo(o.u1,o.sill);h.lineTo(o.u2,o.sill);h.lineTo(o.u2,o.sill+o.h);h.lineTo(o.u1,o.sill+o.h);h.lineTo(o.u1,o.sill);shape.holes.push(h)}
  const g=new THREE.ExtrudeGeometry(shape,{depth:T,bevelEnabled:false,steps:1,curveSegments:24});g.scale(F,F,F);
  const me=new THREE.Mesh(g,MAT.wall);
  if(horiz){me.rotation.y=Math.PI;me.position.set(mx(w.x1),0,m(w.y2))}else{me.rotation.y=-Math.PI/2;me.position.set(mx(w.x1),0,m(w.y1))}
  me.castShadow=true;me.receiveShadow=true;scene.add(me);named(me,`${w.id} · ${w.desc}`);me.userData.wall=w;wallMeshes.push(me);
  for(const o of ops) buildOpening(o,w,horiz,s0);
}
function along(horiz,w,u,v){return horiz?[w.x1+u,w.y1+v]:[w.x1+v,w.y1+u]}
function boxAlong(horiz,w,u1,u2,v1,v2,z1,z2,mat,o){
  if(horiz) return box(w.x1+u1,w.x1+u2,w.y1+v1,w.y1+v2,z1,z2,mat,o);
  return box(w.x1+v1,w.x1+v2,w.y1+u1,w.y1+u2,z1,z2,mat,o)}
const glassMeshes=[];
// ---------------- hall window grills: six designs, picked in the toolbar (Grill) ----------------
const GRILL_WINS=['W-04','W-05'], grillMeshes=[];
const GRILLS={
 'GR-1':'plain vertical round bars, 12 mm @ 5", one middle flat',
 'GR-2':'square grid, 12 mm square bars @ 6" x 6"',
 'GR-3':'horizontal flats, 40 x 6 mm on edge @ 4"',
 'GR-4':'vertical flat slats, 40 x 6 mm on edge @ 4", two cross flats',
 'GR-5':'shoji (Japanese) grid, 12 mm square bars, 12" wide x 6" tall panes',
 'GR-6':'diamond lattice, 12 mm square bars at 45 deg @ 6"'};
// members in the window plane: u along the wall, z height, centred at depth vc (feet); each design merged into one geometry
function grillGeos(U1,U2,Z1,Z2,vc){
  const fr=0.08,a=U1+fr,b=U2-fr,c=Z1+fr,d=Z2-fr,r12=0.04,fl=0.02,fd=0.13;
  const one=(u1,z1,u2,z2,wd,dp,round)=>{const L=Math.hypot(u2-u1,z2-z1);if(L<0.01)return null;
    const g=round?new THREE.CylinderGeometry(wd/2,wd/2,L,10).rotateZ(-Math.PI/2):new THREE.BoxGeometry(L,wd,dp);
    return g.rotateZ(Math.atan2(z2-z1,u2-u1)).translate((u1+u2)/2,(z1+z2)/2,vc)};
  const frame=()=>[one(U1,Z1+fr/2,U2,Z1+fr/2,fr,0.03),one(U1,Z2-fr/2,U2,Z2-fr/2,fr,0.03),one(U1+fr/2,c,U1+fr/2,d,fr,0.03),one(U2-fr/2,c,U2-fr/2,d,fr,0.03)];
  const even=(lo,hi,step)=>{const n=Math.max(1,Math.round((hi-lo)/step)),out=[];for(let i=1;i<n;i++)out.push(lo+(hi-lo)*i/n);return out};
  const V=(xs,wd,dp,round)=>xs.map(u=>one(u,c,u,d,wd,dp,round)), H=(zs,wd,dp)=>zs.map(z=>one(a,z,b,z,wd,dp));
  const diag=step=>{const out=[];for(const sgn of [1,-1]){for(let k=-(b-a)-(d-c);k<(b-a)+(d-c);k+=step){
      // line z-c = sgn*(u-a) + k, clipped to the inner rectangle
      const pts=[];const zu=u=>c+sgn*(u-a)+k, uz=z=>a+(z-c-k)*sgn;
      for(const u of [a,b]){const z=zu(u);if(z>=c-1e-6&&z<=d+1e-6)pts.push([u,z])}
      for(const z of [c,d]){const u=uz(z);if(u>a+1e-6&&u<b-1e-6)pts.push([u,z])}
      if(pts.length>=2)out.push(one(pts[0][0],pts[0][1],pts[1][0],pts[1][1],0.04,0.04))}}return out};
  const sets={
   'GR-1':[...V(even(a,b,0.42),r12,0,true),...H([(c+d)/2],0.08,0.03)],
   'GR-2':[...V(even(a,b,0.5),0.04,0.04),...H(even(c,d,0.5),0.04,0.04)],
   'GR-3':H(even(c,d,0.33),fl,fd),
   'GR-4':[...V(even(a,b,0.33),fl,fd),...H([c+(d-c)/3,c+2*(d-c)/3],0.13,0.02)],
   'GR-5':[...V(even(a,b,1.0),0.04,0.04),...H(even(c,d,0.5),0.04,0.04)],
   'GR-6':diag(0.5*Math.SQRT2)};

function walk(){const now=performance.now(),dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  if(![...keys].some(k=>!k.startsWith('Shift')))return;
  const fast=keys.has('ShiftLeft')||keys.has('ShiftRight'),sp=(fast?2.6:1.3)*dt,tr=(fast?1.6:1.0)*dt;
  const mv=new THREE.Vector3();
  if(keys.has('ArrowUp'))mv.add(fwdVec());if(keys.has('ArrowDown'))mv.sub(fwdVec());
  if(keys.has('KeyD'))mv.add(rightVec());if(keys.has('KeyA'))mv.sub(rightVec());
  if(mv.lengthSq())tryMove(mv.normalize().multiplyScalar(sp));
  if(keys.has('ArrowLeft'))yaw+=tr;if(keys.has('ArrowRight'))yaw-=tr;
  if(keys.has('KeyW'))pitch+=tr*0.8;if(keys.has('KeyS'))pitch-=tr*0.8;
  if(keys.has('KeyE'))moveVertical(sp*0.7);if(keys.has('KeyQ'))moveVertical(-sp*0.7);
  applyLook();invalidate()}
{const el=renderer.domElement;let drag=null;
 el.addEventListener('contextmenu',e=>e.preventDefault());
 el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,b:e.button};el.setPointerCapture(e.pointerId)});
 el.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
   if(drag.b===2||e.shiftKey){tryMove(rightVec().multiplyScalar(-dx*0.006));moveVertical(dy*0.006)}   // slide
   else{const k=THREE.MathUtils.degToRad(hfov)/el.clientWidth;yaw+=dx*k;pitch+=dy*k;applyLook()}     // look around in place (Street View style)
   invalidate()});
 const end=e=>{drag=null};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 el.addEventListener('wheel',e=>{e.preventDefault();tryMove(fwdVec().multiplyScalar(-e.deltaY*0.004));invalidate()},{passive:false});}
document.getElementById('loading').remove();
renderer.setAnimationLoop(()=>{
  walk();
  if(photo&&pt){
    if(building||document.hidden) return;            // ray tracing pauses in a hidden tab
    if(pt.samples>=PHOTO_SAMPLES){ if(saveReq){pt.renderSample();doSave();saveReq=false} statusEl.textContent=`Photo done: ${Math.floor(pt.samples)} samples. Save image, or move to start a new one.`; return }   // stop: no GPU use once finished
    pt.renderSample();statusEl.textContent=pt.isCompiling?'Compiling ray tracer…':`Ray tracing: ${Math.floor(pt.samples)} / ${PHOTO_SAMPLES} samples · keep still`;
    if(saveReq){doSave();saveReq=false} return}
  const now=performance.now();
  if(dirty){renderer.render(scene,camera);dirty=false;lastChange=now;hqDone=false;}
  else if(!hqDone&&now-lastChange>220){composer.render();hqDone=true;}
  if(saveReq&&hqDone){composer.render();doSave();saveReq=false}
});
window.__ready=true;window.__nav={cam:camera,step:(n)=>{for(let i=0;i<n;i++)tryMove(fwdVec().multiplyScalar(0.05))}};
window.__bench=()=>{const gl=renderer.getContext();const t=(f,n)=>{gl.finish();const a=performance.now();for(let i=0;i<n;i++)f();gl.finish();return ((performance.now()-a)/n).toFixed(1)+' ms'};
  return {fast:t(()=>renderer.render(scene,camera),20),softShadows:t(()=>composer.render(),5),texturesPending:pending}};
window.__photo=()=>({on:photo,building,samples:pt?Math.floor(pt.samples):0,compiling:pt?.isCompiling});
</script>
