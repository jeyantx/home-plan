<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home 3D · Japandi</title>
<style>
:root{--bg:#f4f2ee;--panel:#ffffff;--ink:#1f2328;--muted:#5d646d;--line:#dcd8d0;--accent:#2f6f4f;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181b;--panel:#1f2226;--ink:#e8e6e1;--muted:#a3a8ae;--line:#33373c;--accent:#5fb08a;--accent-ink:#0d1a13}}
:root[data-theme="dark"]{--bg:#16181b;--panel:#1f2226;--ink:#e8e6e1;--muted:#a3a8ae;--line:#33373c;--accent:#5fb08a;--accent-ink:#0d1a13}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;flex-direction:column;gap:6px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:2}
h1{font-size:15px;margin:0;cursor:help}
header .row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
header .row.hidden{display:none}
.spacer{flex:1}
.cams.off{display:none}
#areaSel{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;padding:5px 6px;cursor:pointer}
.sub{color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.lbl{font-size:12px;color:var(--muted);margin-right:-6px}
#view{flex:1;position:relative;min-height:0}
canvas{display:block;width:100%;height:100%}
#view>canvas{position:absolute;left:0;top:0}
#view.framed{background:#3a3d41}
#tip{position:fixed;pointer-events:none;background:#1f2328;color:#fff;font-size:12.5px;padding:6px 9px;border-radius:7px;display:none;max-width:320px;z-index:5}
#tip b{color:#9fe0bf}
#panel{position:absolute;right:12px;top:12px;width:310px;max-height:calc(100% - 24px);overflow:auto;background:rgba(255,255,255,.94);color:#1f2328;border:1px solid #dcd8d0;border-radius:10px;padding:12px 14px;font-size:12.5px}
#panel.hidden{display:none}
#panel h2{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#5d646d;margin:6px 0}
#panel ul{margin:0;padding-left:16px}#panel li{margin:3px 0}
#panel .sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #0002;vertical-align:-2px;margin-right:5px}
#status{position:absolute;left:12px;bottom:12px;background:rgba(20,22,25,.78);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:8px;display:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
#tourCap{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(20,22,25,.8);color:#fff;font-size:15px;font-weight:600;padding:8px 16px;border-radius:999px;display:none;pointer-events:none;white-space:nowrap}
#tourCap small{font-weight:400;opacity:.8;margin-left:8px;font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
</style>

<header>
 <div class="row">

  <div class="seg" id="lightSeg"><button data-l="day">Day</button><button data-l="eve">Evening</button></div>

<div class="seg cams" data-area="0"><button data-c="0">Entry</button><button data-c="1">Corner</button><button data-c="2">From sofa</button><button data-c="3">From TV</button><button data-c="4">From kitchen</button><button data-c="5">Top</button></div>  <div class="seg cams" data-area="1"><button data-c="6">Door</button><button data-c="7">Window</button><button data-c="8">Study</button><button data-c="9">Toilet</button><button data-c="10">Top</button></div>  <div class="seg cams" data-area="2"><button data-c="11">Kitchen</button><button data-c="12">Sink</button><button data-c="13">Hob</button><button data-c="14">Fridge</button><button data-c="15">Top</button></div>  <div class="seg cams" data-area="3"><button data-c="16">Door</button><button data-c="17">Bed</button><button data-c="18">Window</button><button data-c="19">Toilet 2</button><button data-c="20">Top</button></div>  <div class="seg cams" data-area="4"><button data-c="21">Gate</button><button data-c="22">Parking</button><button data-c="23">Terrace</button><button data-c="24">Aerial</button><button data-c="25">Side</button><button data-c="26">Stair</button><button data-c="32">Back garden</button><button data-c="33">Gate levels</button><button data-c="34">Front</button><button data-c="36">Side garden</button><button data-c="37">Porch</button></div>
  <div class="seg cams" data-area="5"><button data-c="27">Spiral</button><button data-c="28">Landing</button><button data-c="29">Well</button><button data-c="26">ST-1</button></div>
  <div class="seg cams" data-area="6"><button data-c="28">Landing</button><button data-c="30">Bedroom 3</button><button data-c="23">Terrace</button><button data-c="31">Top</button></div>
  <span class="spacer"></span>
  <button class="btn" id="tourBtn" aria-pressed="false" title="Walk through the whole house on a set path: gate, parking, porch, rooms, up the spiral stair, first floor, terrace and down the outside stair. Any key or click stops it.">Home tour</button>
  <button class="btn" id="animBtn" aria-pressed="false" title="Watch the car come in from the road, reverse into its spot, wait, and drive out">Animate car parking</button>
  <button class="btn" id="photoBtn" aria-pressed="false" title="Ray-traced photo of the current view. Uses the graphics card heavily for about a minute, then stops by itself.">Photo</button>

  <button class="btn" id="notesBtn" aria-pressed="false">Notes</button>
  <button class="btn" id="optBtn" aria-pressed="false" title="Show or hide the gate, colour, finish and lens options">Options ▾</button>
 </div>
 <div class="row hidden" id="optRow">
  <span class="lbl">Frame</span><div class="seg" id="ratioSeg"><button data-r="fill" title="Use the whole window">Fill</button><button data-r="16:9" title="Show the 3D view at 16:9">16:9</button><button data-r="4:3" title="Show the 3D view at 4:3">4:3</button><button data-r="1:1" title="Show the 3D view at 1:1">1:1</button><button data-r="4:5" title="Show the 3D view at 4:5 (portrait)">4:5</button><button data-r="3:4" title="Show the 3D view at 3:4 (portrait)">3:4</button><button data-r="9:16" title="Show the 3D view at 9:16 (portrait)">9:16</button></div>
  <span class="lbl">Lens</span><div class="seg" id="lensSeg"><button data-f="60" title="Eye-like lens">60°</button><button data-f="75" title="Wide lens">75°</button></div>
 </div>
</header>

<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {createBambooPlant} from './models/bamboo-plant.js?v=__BUILD__';
import {createNeemTree} from './models/neem-tree.js?v=__BUILD__';
import {createTNPlant,TN_PLANTS} from './models/tn-plants.js?v=__BUILD__';
import {createBanana,createArecaPalm,createMoringa} from './models/garden-plants.js?v=__BUILD__';
import {createVirtus,createHunter350,createAther450,loadCarGLB,loadGLBVehicle} from './models/vehicles.js?v=__BUILD__';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {CAR_ROUTE} from './models/car-route.js?v=__BUILD__';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

const P=window.PLAN, F=0.3048, CEIL=10.0, EYE=5.25;
// site levels (feet, relative to the house floor): road, gate crest, parking, neighbours' ground; the gardens stay at GRD (1' below the floor)
const LV=P.levels||{road:2.5,hump:2.5,parking:2.5,garden:2.5,floor:3.5},RP=P.ramp||{y_hump:0,y_crest:0,y_top:0,drain:[0,0]};
const GRD=LV.garden-LV.floor,RDZ=LV.road-LV.floor,HUZ=LV.hump-LV.floor,PKZ=LV.parking-LV.floor,NBZ=Math.min(RDZ+1.0,LV.garden-LV.floor);
const rampH=u=>{const L=RP.y_top-RP.y_crest,e=Math.min(RP.ease||0,L/2),H=PKZ-HUZ,s=H/(L-e);   // ramp rise at u feet up the ramp: eased ends at half the slope
  return u<e?s/2*u:u<L-e?s/2*e+s*(u-e):H-s/2*(L-u)};
const zF=y=>y<=0?RDZ:y<RP.y_hump?RDZ+(HUZ-RDZ)*y/RP.y_hump:y<RP.y_crest?HUZ:y<RP.y_top?HUZ+rampH(y-RP.y_crest):PKZ;   // front drive profile
const m=v=>v*F, mx=v=>-v*F;   // plan X grows toward the west = three -x, so the world is not mirrored
const view=document.getElementById('view'), statusEl=document.getElementById('status');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap; renderer.shadowMap.autoUpdate=false; renderer.shadowMap.needsUpdate=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
view.appendChild(renderer.domElement);
RectAreaLightUniformsLib.init();
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,1,0.05,300);
camera.rotation.order='YXZ'; let yaw=0, pitch=0;   // first-person look: the camera turns in place
const wallMeshes=[], ceilingMeshes=[];
let dirty=true,hqDone=false,lastChange=0;
let photo=false, pt=null; const PHOTO_SAMPLES=256;
function invalidate(){dirty=true;if(photo&&pt)pt.updateCamera()}

// ---------------- textures: real CC0 scans from Poly Haven, stored locally in assets/ ----------------
const loader=new THREE.TextureLoader(); let pending=0;
function tex(path,srgb,repeatM){pending++;const t=loader.load(path,()=>{pending--;renderer.shadowMap.needsUpdate=true;invalidate()},undefined,()=>{pending--});
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1/repeatM,1/repeatM);t.anisotropy=8;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t}
function pbr(name,sizeM,withMap=true){const b=`assets/textures/${name}/${name}_`;
  return {map:withMap?tex(b+'diff_1k.jpg',true,sizeM):null,normalMap:tex(b+'nor_gl_1k.jpg',false,sizeM),roughnessMap:tex(b+'rough_1k.jpg',false,sizeM)}}
const T={
  floorOak:pbr('laminate_floor_02',1.70),
  oak:pbr('white_oak_veneer',0.50),
  oakPanel:pbr('oak_veneer_01',1.83),
  linen:pbr('rough_linen',0.27),
  sheer:pbr('crepe_georgette',0.26,false),
  jute:pbr('hessian_230',0.27),
  paint:pbr('ceiling_interior',2.0,false),
};
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function canvasTex(w,h,draw,sizeM){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1/sizeM,1/sizeM);t.anisotropy=8;t.colorSpace=THREE.SRGBColorSpace;return t}
// vitrified grey parking tile, 400 x 400 mm, matt: speckled grey 200 x 100 mm bricks in a 90-degree herringbone, dark joints (one tile = one repeat)
function parkingTile(){return canvasTex(1024,1024,(g,w,h)=>{const u=w/4,r=rng(36603),bricks=[];
  for(let mm=-3;mm<=3;mm++)for(let k=-8;k<=8;k++){bricks.push([k+2*mm,k-2*mm,2,1],[k+2*mm,k+1-2*mm,1,2])}
  const draw=(fn)=>{for(const [x,y,bw,bh] of bricks)for(const ox of [-4,0,4])for(const oy of [-4,0,4]){const X=(x+ox)*u,Y=(y+oy)*u;if(X>w||Y>h||X+bw*u<0||Y+bh*u<0)continue;fn(X,Y,bw*u,bh*u)}};
  g.fillStyle='#262626';g.fillRect(0,0,w,h);
  draw((X,Y,W,H)=>{const v=Math.round((r()-0.5)*10);g.fillStyle=`rgb(${143+v},${143+v},${140+v})`;g.fillRect(X+5,Y+5,W-10,H-10)});
  g.save();g.beginPath();draw((X,Y,W,H)=>g.rect(X+5,Y+5,W-10,H-10));g.clip();
  for(let i=0;i<60000;i++){const t=r(),c=t<0.38?'rgba(70,70,68,0.75)':t<0.7?'rgba(205,205,200,0.8)':t<0.85?'rgba(110,110,106,0.7)':'rgba(170,166,158,0.7)',s=1+r()*2.6;g.fillStyle=c;g.fillRect(r()*w,r()*h,s,s)}
  g.restore()},0.4)}
// plain light cement (broom-finished concrete): fine grain, faint trowel patches
function cementTex(){return canvasTex(1024,1024,(g,w,h)=>{const r=rng(707);g.fillStyle='#cbc8c1';g.fillRect(0,0,w,h);
  for(let i=0;i<300;i++){g.fillStyle=`rgba(${r()<0.5?'255,255,255':'90,85,78'},0.035)`;g.beginPath();g.ellipse(r()*w,r()*h,30+r()*120,15+r()*60,r()*3,0,7);g.fill()}
  for(let i=0;i<80000;i++){g.fillStyle=r()<0.5?'rgba(0,0,0,0.06)':'rgba(255,255,255,0.08)';const z=1+r()*2;g.fillRect(r()*w,r()*h,z,z)}
  for(let y=0;y<h;y+=3){g.fillStyle=`rgba(0,0,0,${0.012+r()*0.015})`;g.fillRect(0,y,w,1)}},1.2)}
function stoneTiles(base,seed,tx,ty,tileFt){return canvasTex(1024,1024*ty/tx,(g,w,h)=>{const r=rng(seed);g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){const v=(r()-.5)*0.05;g.fillStyle=v>0?`rgba(255,255,255,${v})`:`rgba(0,0,0,${-v})`;g.fillRect(r()*w,r()*h,3,3)}
  for(let i=0;i<220;i++){g.fillStyle=`rgba(${r()<.5?'255,255,255':'120,110,95'},0.05)`;g.beginPath();g.ellipse(r()*w,r()*h,8+r()*40,4+r()*20,r()*3,0,7);g.fill()}
  g.fillStyle='rgba(120,112,100,0.5)';for(let i=0;i<=tx;i++)g.fillRect(i*w/tx-1.5,0,3,h);for(let j=0;j<=ty;j++)g.fillRect(0,j*h/ty-1.5,w,3)},m(tileFt*tx))}
// pressed clay terrace tiles, 9" x 9": each tile a slightly different terracotta, with clear grout lines
function clayTiles(){const n=4;return canvasTex(1024,1024,(g,w,h)=>{const r=rng(61),t=w/n;g.fillStyle='#7d5a44';g.fillRect(0,0,w,h);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const k=r();g.fillStyle=`rgb(${178+k*22|0},${108+k*16|0},${74+k*12|0})`;g.fillRect(i*t+5,j*t+5,t-10,t-10);
    for(let q=0;q<500;q++){const v=(r()-.5)*0.1;g.fillStyle=v>0?`rgba(255,255,255,${v})`:`rgba(0,0,0,${-v})`;g.fillRect(i*t+5+r()*(t-10),j*t+5+r()*(t-10),3,3)}}},m(0.75*n))}
function shade(hex,k){const c=new THREE.Color(hex);c.offsetHSL(0,0,k);return '#'+c.getHexString()}

// ---------------- materials ----------------
const std=o=>new THREE.MeshStandardMaterial(o), phys=o=>new THREE.MeshPhysicalMaterial(o);
const paintN=new THREE.Vector2(0.06,0.06);   // smooth emulsion over plaster: only a hint of texture
const MAT={
  ceiling:std({color:'#fbfaf7',roughness:0.92,normalMap:T.paint.normalMap,normalScale:paintN}),
  otherFloor:std({map:stoneTiles('#e7e2da',5,2,2,2),roughness:0.6}),
  wallOut:std({color:'#ece6dc',roughness:0.95}),
  white:std({color:'#f6f4f0',roughness:0.9,normalMap:T.paint.normalMap,normalScale:paintN}),
  upvc:std({color:'#f2f2f0',roughness:0.35}),
  blackMetal:std({color:'#1d1e21',roughness:0.4,metalness:0.7}),
  grill:std({color:'#1d1e21',roughness:0.45,metalness:0.6,side:THREE.DoubleSide}),
  glassRaster:std({color:'#dfe9ee',roughness:0.04,metalness:0,transparent:true,opacity:0.14,depthWrite:false}),
  glassPhoto:phys({color:'#ffffff',roughness:0.02,metalness:0,transmission:1,thickness:0.006,ior:1.5}),
  oak:std({map:T.oak.map,normalMap:T.oak.normalMap,normalScale:new THREE.Vector2(0.4,0.4),roughnessMap:T.oak.roughnessMap,roughness:0.8}),
  oakDark:std({map:T.oak.map,normalMap:T.oak.normalMap,color:'#b9997c',roughness:0.6}),
  teak:std({map:T.oakPanel.map,normalMap:T.oakPanel.normalMap,color:'#8a5f3c',roughness:0.5}),
  granite:std({color:'#2a2c2f',roughness:0.22,metalness:0.05}),
  cabinet:std({color:'#ece7de',roughness:0.55}),
  screen:std({color:'#08090a',roughness:0.12,metalness:0.3}),
  grass:std({color:'#6c8a4b',roughness:1}),
  paving:std({map:stoneTiles('#bdb6aa',7,2,2,2),roughness:0.9}),
  neighbour:std({color:'#ddd1bd',roughness:0.95}),
  compound:std({color:'#cfc8bb',roughness:0.95}),
  leaf:std({color:'#3b5f2f',roughness:0.55,side:THREE.DoubleSide}),
  pot:std({color:'#d6cfc2',roughness:0.85}),
  paper:std({color:'#fff6e6',emissive:'#ffcf8a',emissiveIntensity:0,roughness:0.9,side:THREE.DoubleSide}),
  sheerRaster:std({color:'#f5f0e8',roughness:1,side:THREE.DoubleSide,transparent:true,opacity:0.86,normalMap:T.sheer.normalMap,roughnessMap:T.sheer.roughnessMap}),
  sheerPhoto:phys({color:'#f8f3ea',roughness:0.95,side:THREE.DoubleSide,transmission:0.62,thickness:0.0005,ior:1.3,sheen:1,sheenRoughness:0.7,sheenColor:new THREE.Color('#ffffff'),normalMap:T.sheer.normalMap,roughnessMap:T.sheer.roughnessMap}),
  led:std({color:'#ffffff',emissive:'#ffcf94',emissiveIntensity:0}),
  floor:std({roughness:0.5}),
  wall:std({roughness:0.95,normalMap:T.paint.normalMap,normalScale:paintN}),
  accent:std({roughness:0.95,normalMap:T.paint.normalMap,normalScale:paintN}),
  sofa:std({normalMap:T.linen.normalMap,normalScale:new THREE.Vector2(0.8,0.8),roughnessMap:T.linen.roughnessMap,roughness:1}),   // weave from the scan, colour from the option
  sofaWood:std({map:T.oakPanel.map,normalMap:T.oakPanel.normalMap,normalScale:new THREE.Vector2(0.4,0.4),roughness:0.55,color:new THREE.Color(0.52,0.36,0.24)}),   // dark walnut-tone stain
  rug:std({map:T.jute.map,normalMap:T.jute.normalMap,roughnessMap:T.jute.roughnessMap,roughness:1}),
  tvPanel:std({map:T.oakPanel.map,normalMap:T.oakPanel.normalMap,roughnessMap:T.oakPanel.roughnessMap,roughness:0.8}),
  skirt:std({roughness:0.5}),
  ext:std({roughness:0.95,normalMap:T.paint.normalMap,normalScale:new THREE.Vector2(0.15,0.15)}),
  extTrim:std({roughness:0.9}),
